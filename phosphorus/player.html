<script>
window.fillpage = true;
window.skipgui2 = true;

window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey) {
        const key = e.key.toLowerCase();
        const url = new URL(window.location.href);

        let id = url.searchParams.get('id') || url.hash.replace('#', '');

        if (key === 'p') {
            e.preventDefault();
            window.location.href = '/player' + (id ? '#' + id : '');
        }

        if (key === 'e') {
            e.preventDefault();
            window.location.href = '/' + (id ? '#' + id : '');
        }
    }
});

(function() {
  'use strict';

  window.projectId = location.hash?location.hash.split('#').pop():1320635584;
  var autoStart = true;
  var lightContent = false;
  var hasUI = true;

  var params = location.search.substr(1).split('&');
  params.forEach(function(p) {
    var parts = p.split('=');
    if (parts.length > 1) {
      switch (parts[0]) {
        case 'id':
          projectId = Number(parts[1]);
          break;
        case 'auto-start':
          autoStart = parts[1] !== 'false';
          break;
        case 'light-content':
          lightContent = parts[1] !== 'false';
          break;
        case 'ui':
          hasUI = parts[1] !== 'false';
          break;
      }
    }
  });

  if (lightContent) document.body.className += ' light-content';
  document.body.className += hasUI ? ' has-ui' : ' hide-ui';

  document.title = 'phosphorus';

  P.player.load(projectId, function(stage) {
    if (autoStart || !hasUI) stage.triggerGreenFlag();
  }, function(title) {
    // document.title = title ? title + ' \xb7 phosphorus' : 'phosphorus';
  });

}());

</script>

<script src="/scratchGUI.js" onload="if(projectId != 1320635584) ShowCard(projectId);"></script>
